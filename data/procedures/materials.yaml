# Base material properties that drive preheat, heat input limits and interpass
# temperature. Carbon equivalent is CEV to IIW; preheat follows the method of
# EN 1011-2 in simplified band form.

materials:
  S235:
    group: carbon_steel
    procedure: gmaw_carbon_steel
    yield_mpa: 235
    cev: 0.35
    density_kg_mm3: 7.85e-6
    heat_input_max_kj_mm: 3.0
    interpass_max_c: 250.0
    preheat_bands_mm_c: [[25, 20], [40, 75], [60, 100], [1000, 150]]

  S275:
    group: carbon_steel
    procedure: gmaw_carbon_steel
    yield_mpa: 275
    cev: 0.40
    density_kg_mm3: 7.85e-6
    heat_input_max_kj_mm: 2.8
    interpass_max_c: 250.0
    preheat_bands_mm_c: [[20, 20], [35, 75], [55, 100], [1000, 150]]

  S355:
    group: carbon_steel
    procedure: gmaw_carbon_steel
    yield_mpa: 355
    cev: 0.45
    density_kg_mm3: 7.85e-6
    # Fine-grained structural steel: too much heat coarsens the HAZ and loses
    # the toughness the grade was bought for.
    heat_input_max_kj_mm: 2.5
    interpass_max_c: 250.0
    preheat_bands_mm_c: [[15, 20], [30, 75], [50, 125], [1000, 175]]

  S460:
    group: carbon_steel
    procedure: gmaw_carbon_steel
    yield_mpa: 460
    cev: 0.47
    density_kg_mm3: 7.85e-6
    heat_input_max_kj_mm: 2.0
    interpass_max_c: 225.0
    preheat_bands_mm_c: [[12, 50], [25, 100], [40, 150], [1000, 200]]

  "304":
    group: austenitic_stainless
    procedure: gmaw_stainless
    yield_mpa: 210
    cev: 0.0
    density_kg_mm3: 7.90e-6
    heat_input_max_kj_mm: 1.5
    # Austenitic grades are never preheated and need a low interpass ceiling to
    # stay out of the sensitisation range.
    interpass_max_c: 150.0
    preheat_bands_mm_c: [[1000, 20]]

  316L:
    group: austenitic_stainless
    procedure: gmaw_stainless
    yield_mpa: 220
    cev: 0.0
    density_kg_mm3: 8.00e-6
    heat_input_max_kj_mm: 1.5
    interpass_max_c: 150.0
    preheat_bands_mm_c: [[1000, 20]]
