notes:
- 'SHAPE DEMONSTRATION ONLY. Confirm nothing from this robot: the kinematics are a
  KUKA KR 16-2 and the link geometry is boxes and cylinders generated to show that
  per-link meshes are drawn and animated. Do not use it to judge clearances.'
- Confirm axis signs, zero offsets and link geometry against the real controller before
  any generated program is run.
- 'To draw a real robot: copy its link meshes into data/robots/meshes/<name>/ and
  add a visual: block like the one in this file to that robot''s own YAML. Vendor
  and ROS meshes are modelled in the vendor''s link frames, not in the modified DH
  frames used here, so each link usually needs an xyz/rpy_deg offset set once by comparing
  the two. See data/robots/meshes/README.md.'
