# Fanuc ARC Mate 100iD. Note J3's very wide travel, which gives the analytic
# solver's +-2*pi alias search real work to do: solutions a full turn away from
# the principal arctangent value are frequently the only ones inside limits.
name: Fanuc ARC Mate 100iD
vendor: FANUC
reach_mm: 1420
payload_kg: 12.0
wrist: spherical
notes:
  - "Nominal geometry. Confirm axis signs and zero offsets against the real controller."

joints:
  - { name: J1, alpha: 0.0,   a: 0.0,   d: 450.0, limit_deg: [-170, 170], max_speed_deg_s: 210 }
  - { name: J2, alpha: -90.0, a: 150.0, d: 0.0,   limit_deg: [-100, 145], max_speed_deg_s: 210 }
  - { name: J3, alpha: 0.0,   a: 600.0, d: 0.0,   limit_deg: [-220, 250], max_speed_deg_s: 225 }
  - { name: J4, alpha: -90.0, a: 0.0,   d: 615.0, limit_deg: [-200, 200], max_speed_deg_s: 425 }
  - { name: J5, alpha: 90.0,  a: 0.0,   d: 0.0,   limit_deg: [-140, 140], max_speed_deg_s: 425 }
  - { name: J6, alpha: -90.0, a: 0.0,   d: 100.0, limit_deg: [-450, 450], max_speed_deg_s: 630 }

home_deg: [0, -60, 60, 0, 60, 0]
