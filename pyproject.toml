[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weldforge"
version = "0.1.0"
description = "From 3D model to robotic weld: seam recognition, WPS generation, fixturing, kinematics and cell execution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Antonio Moccia" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "networkx>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# OpenCASCADE kernel. Pick ONE:
#   pip extra `cad`  -> cadquery-ocp wheels (macOS/Windows/Linux, no conda)
#   conda            -> pythonocc-core (used inside the ROS 2 container)
cad = ["cadquery-ocp>=7.7"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
sim = ["manifold3d>=2.3", "rtree>=1.2", "shapely>=2.0"]
# The desktop application. VTK does the 3-D view and the picking; PySide6 the
# window. Both ship as wheels on every platform the application targets.
studio = ["PySide6>=6.6", "vtk>=9.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # fastapi.testclient refuses to import without an HTTP client, so the API
    # tests cannot even be collected otherwise. Starlette 1.x asks for httpx2;
    # older ones for httpx, hence both.
    "httpx2>=0.1; python_version >= '3.10'",
    "httpx>=0.27",
]
# The documentation build. pdoc renders the API reference from the docstrings
# with no configuration to maintain; markdown renders the hand-written pages
# and is optional -- without it they are shown unrendered rather than missing.
docs = ["pdoc>=14.0", "markdown>=3.5"]
# Standalone executables. PyInstaller support for a new Python release lags it
# by months, which is why the packaging stage is allowed to fail on its own.
build = ["pyinstaller>=6.6"]
all = ["weldforge[cad,api,sim,studio,dev,docs,build]"]

[project.scripts]
weldforge = "weldforge.cli:main"

[project.gui-scripts]
weldforge-studio = "weldforge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Not only YAML: the language catalogues are JSON and the robot link geometry
# is mesh files. Listing just *.yaml shipped a build whose window could not be
# translated and whose robots had no shape.
weldforge = [
    "../../data/**/*.yaml",
    "../../data/**/*.json",
    "../../data/**/*.stl",
    "../../data/**/*.step",
    "../../data/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "needs_cad: requires an OpenCASCADE backend (OCP or pythonocc)",
    "slow: takes more than a couple of seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The bootstrap script runs on whatever Python the machine already has, which
# may predate the project's floor -- so its version check is not redundant,
# whatever target-version says. Refusing with a sentence beats a traceback.
"tools/bootstrap.py" = ["UP036"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
