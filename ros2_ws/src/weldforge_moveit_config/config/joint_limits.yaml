# Velocity and acceleration limits used for time parameterisation.
#
# The velocities are a fraction of the data-sheet maxima: a controller never
# reaches them once blending and acceleration limits apply, and a trajectory
# timed at 100% arrives late, which on a welding move means the travel speed
# was wrong and the bead is wrong with it.
default_velocity_scaling_factor: 0.7
default_acceleration_scaling_factor: 0.5

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 2.72
    has_acceleration_limits: true
    max_acceleration: 8.0
  joint_2:
    has_velocity_limits: true
    max_velocity: 2.72
    has_acceleration_limits: true
    max_acceleration: 8.0
  joint_3:
    has_velocity_limits: true
    max_velocity: 2.72
    has_acceleration_limits: true
    max_acceleration: 8.0
  joint_4:
    has_velocity_limits: true
    max_velocity: 5.76
    has_acceleration_limits: true
    max_acceleration: 15.0
  joint_5:
    has_velocity_limits: true
    max_velocity: 5.76
    has_acceleration_limits: true
    max_acceleration: 15.0
  joint_6:
    has_velocity_limits: true
    max_velocity: 10.73
    has_acceleration_limits: true
    max_acceleration: 20.0
