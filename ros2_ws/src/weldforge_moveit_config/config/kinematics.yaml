# Inverse kinematics for the welding arm.
#
# KDL is the default because it is always available, but it is a numeric
# solver: it finds *a* solution, chosen by the seed, and consecutive seam
# stations can land in different arm configurations -- which makes the robot
# reconfigure in the middle of a bead.
#
# WeldForge's own planner does not use this: it solves the closed form for all
# eight configurations and keeps the path on one of them (see
# weldforge.kin.ik). This entry is for MoveIt's own interactive planning, and
# for anything that asks MoveIt for IK directly.
#
# For production, replace with an IKFast plugin generated for the specific
# arm: it is analytic, 100x faster, and returns every solution.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
