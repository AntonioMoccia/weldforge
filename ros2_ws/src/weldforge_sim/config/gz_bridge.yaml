# ros_gz_bridge topic mapping.
#
# Only what is actually needed crosses the bridge: the clock, so ROS and
# Gazebo agree on time, and the joint states. Bridging everything is a
# standing performance problem in a cell that runs for hours.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/welding_cell/model/weldforge_cell/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
